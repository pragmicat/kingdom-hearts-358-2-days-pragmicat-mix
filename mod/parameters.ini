[buffer_ms]
type = integer
default = 200
min = 50
max = 400
label = Input buffer (milliseconds)
help = How long early attack, Jump and defense taps are remembered while waiting for a legal transition.

[attack_speed]
type = number
default = 1.25
min = 1.0
max = 1.6
label = Attack animation speed
help = Speeds up Roxas's native combo animation and contact clock together. 1.25 is the initial tuning preset.

[technique_direction_style]
type = choice
choices = Precise, Standard, Forgiving
default = Standard
label = Technique direction feel
help = Forgiving makes diagonal toward/away inputs easier for advancing and launcher Techniques, Rush and Burst. Precise favors side Techniques. Standard keeps the original directions. Left/right moves remain available in every profile; direction is captured when you press.

[movement_speed]
type = number
default = 1.15
min = 1.0
max = 1.4
label = Ground movement speed
help = Scales Roxas's normal ground movement through the original mover and collision rules.

[turn_speed]
type = number
default = 1.3
min = 1.0
max = 1.6
label = Ground turning response
help = Speeds up normal ground turning while retaining the original movement system.

[defensive_cancels]
type = flag
default = yes
label = Dodge and guard exits
help = Clean hits open earlier defensive exits. Missed attacks retain their contact tail and recovery; one brief defense can preserve the attack route.

[browser_hit_feedback]
type = flag
default = yes
label = Gamepad hit vibration (browser)
help = Feel a short pulse when a melee attack from your controller deals damage. Ending Techniques give a stronger pulse on supported gamepads.

[repertoire_debug]
type = flag
default = no
label = Developer repertoire browser
help = For move auditing only. Select cycles original weapon graphs and the full record survey. Keep off for the intended mixed campaign combos.

[signature_damage]
type = number
default = 1.0
min = 0.25
max = 1.0
label = Signature damage
help = Damage share of the original Roxas Limit-derived attacks, independently of their native effect timing.

[drive_enabled]
type = flag
default = yes
label = Dual-wield Drive
help = Successful combat charges a timed native dual-wield transformation in Story Mode. Select requests activation or early reversion.

[drive_meter]
type = flag
default = yes
label = Drive display
help = Shows charge, queued form changes and remaining dual-wield time during combat. In the browser the gauge sits between the two game screens.

[drive_charge_hits]
type = integer
default = 40
min = 10
max = 80
label = Drive charge connections
help = Distinct single-target melee connections needed to fill Drive. Multi-hit contacts do not repeatedly charge it; up to two targets per attack count.

[drive_seconds]
type = integer
default = 15
min = 8
max = 30
label = Drive duration
help = Timed form duration in seconds. Menus and cinematics pause the clock; the current action and active spells finish before restoration.
