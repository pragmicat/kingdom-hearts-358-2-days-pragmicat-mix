name: Combat checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  combat:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python tests/run_tests.py
      - run: python -m pip install lupa==2.8
      - run: python tests/practice_lua_tests.py
      - name: Link complete portable plugin
        run: g++ -std=c++20 -shared -fPIC -Wall -Wextra -Ivendor/sdk/include -Igenerated src/*.cpp -o /tmp/pragmicat_mix.so
